name: Linux AppImage

# Builds the installer app as an AppImage on Linux, tests it, and attaches it
# to the release. Runs automatically when a release is published, or by hand
# (leave the tag empty for a test build that isn't attached to any release).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the AppImage to (empty = test build only)
        default: ""
        required: false

permissions:
  contents: write

jobs:
  appimage:
    # Older Ubuntu = older glibc, so the AppImage runs on more distros
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"   # run appimagetool / the AppImage without FUSE
    steps:
      - uses: actions/checkout@v4

      - name: Check the release tag matches the app's version
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' installer_gui.py)
          if [ -z "$VERSION" ] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' doesn't match the app's version 'v$VERSION' (VERSION in installer_gui.py)"
            exit 1
          fi
          echo "Tag $TAG matches the app's version"

      - name: Install Python, Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip pillow pyinstaller

      - name: Get appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Test install / backup / uninstall / restore on real Linux
        run: |
          .venv/bin/python build_cursors.py
          PIBBY_TEST_ROOT="$RUNNER_TEMP/home" PIBBY_NO_APPLY=1 .venv/bin/python - <<'EOF'
          import os
          from pathlib import Path
          import installer_gui as ig
          home = Path(os.environ["PIBBY_TEST_ROOT"])
          mine = home / ".icons/MyCustom/cursors"; mine.mkdir(parents=True)
          (mine / "default").write_bytes(b"custom")
          (home / ".icons/default").mkdir(parents=True)
          (home / ".icons/default/index.theme").write_text("[Icon Theme]\nInherits=MyCustom\n")
          l = ig.LinuxCursors()
          assert l.detect()["kind"] == "custom" and l.has_custom()
          l.backup(); l.install()
          cur = l.install_dir / "cursors"
          links = [p for p in cur.iterdir() if p.is_symlink()]
          assert len(list(cur.iterdir())) == 103 and len(links) == 88, (len(list(cur.iterdir())), len(links))
          assert all(p.resolve().is_file() for p in links), "dangling symlink"
          assert (cur / "text").resolve().name == "text" and (cur / "left_ptr").resolve().name == "default"
          d = l.detect(); assert d["kind"] == "pibby" and "15/15" in d["summary"], d
          import shutil; shutil.rmtree(mine.parent)
          l.uninstall(); assert not l.install_dir.exists()
          l.restore(); assert (mine / "default").read_bytes() == b"custom"
          assert l.detect()["name"] == "MyCustom"
          print("Linux install/backup/uninstall/restore: OK (103 names, 88 real symlinks)")
          EOF
          # the shell installer too
          mkdir -p "$RUNNER_TEMP/sh" && cd "$RUNNER_TEMP/sh" && unzip -q "$GITHUB_WORKSPACE/dist/PibbyGlitchCursor-linux.zip"
          HOME="$RUNNER_TEMP/shhome" sh ./install.sh
          test -L "$RUNNER_TEMP/shhome/.icons/PibbyGlitchCursor/cursors/left_ptr"
          echo "install.sh: OK"

      - name: Test the packaged app (same module exclusions as the release build)
        run: |
          cat > "$RUNNER_TEMP/frozen_test.py" <<'EOF'
          import hashlib, json, os, shutil, subprocess, webbrowser, tkinter as tk
          from pathlib import Path
          from tkinter import ttk
          import installer_gui as ig
          home = Path(os.environ["PIBBY_TEST_ROOT"])
          assert subprocess.run(["true"], capture_output=True, text=True, timeout=5).returncode == 0
          assert hashlib.sha256(b"x").hexdigest()
          mine = home / ".icons/MyCustom/cursors"; mine.mkdir(parents=True)
          (mine / "default").write_bytes(b"custom")
          (home / ".icons/default").mkdir(parents=True)
          (home / ".icons/default/index.theme").write_text("[Icon Theme]\nInherits=MyCustom\n")
          l = ig.LinuxCursors()
          l.backup(); l.install()
          assert l.detect()["kind"] == "pibby"
          shutil.rmtree(mine.parent); l.uninstall(); l.restore()
          assert (mine / "default").read_bytes() == b"custom"
          print("packaged install/backup/uninstall/restore: OK")

          def find(w, cls):
              for c in w.winfo_children():
                  if isinstance(c, cls):
                      yield c
                  yield from find(c, cls)
          res, orig = {}, tk.Tk.mainloop
          def mainloop(self):
              glitch = next(c for c in find(self, ttk.Checkbutton) if "Glitch" in c.cget("text"))
              def start():
                  if not self.winfo_viewable():  # clicks only arrive once the window is on screen
                      self.after(100, start)
                      return
                  glitch.invoke()
                  for lbl in list(find(self, tk.Label)):
                      if lbl.cget("text") in ("Credits…", "Details…"):
                          lbl.event_generate("<Button-1>")
              seen = []
              def snap():
                  wins = [self] + [w for w in self.winfo_children() if isinstance(w, tk.Toplevel)]
                  res["windows"] = len(wins)
                  seen.append(sum(1 for w in wins for f in w.winfo_children()
                                  if isinstance(f, tk.Frame) and f.winfo_manager() == "place"))
              self.after(200, start)
              for i in range(60):
                  self.after(600 + i * 50, snap)
              self.after(4000, lambda: (res.update(bars=max(seen)), self.destroy()))
              orig(self)
          tk.Tk.mainloop = mainloop
          ig.run_gui()
          saved = json.loads((home / ".local/share/PibbyGlitchCursor/settings.json").read_text())
          assert res["windows"] == 3 and res["bars"] > 0 and saved["glitch_windows"] is True, (res, saved)
          print(f"packaged GUI: OK ({res['windows']} windows glitching, setting saved)")
          EOF
          EXCLUDES=$(.venv/bin/python -c "import build_installer as b; print(' '.join('--exclude-module=' + m for m in b.EXCLUDES))")
          .venv/bin/python -m PyInstaller --noconfirm --onedir --log-level WARN --paths "$PWD" \
            --distpath "$RUNNER_TEMP/fz" --workpath "$RUNNER_TEMP/fzwork" --specpath "$RUNNER_TEMP" \
            --add-data "$PWD/images/cursor:payload/preview" \
            --add-data "$PWD/dist/linux/PibbyGlitchCursor.tar.gz:payload/linux" \
            $EXCLUDES "$RUNNER_TEMP/frozen_test.py"
          PIBBY_TEST_ROOT="$RUNNER_TEMP/fzhome" PIBBY_NO_APPLY=1 timeout 120 xvfb-run -a "$RUNNER_TEMP/fz/frozen_test/frozen_test"

      - name: Build AppImage
        run: .venv/bin/python build_installer.py

      - name: Check the AppImage launches
        run: |
          APP=dist/PibbyGlitchCursorInstaller-x86_64.AppImage
          chmod +x "$APP"
          set +e
          PIBBY_TEST_ROOT="$RUNNER_TEMP/launch" PIBBY_NO_APPLY=1 xvfb-run -a timeout 15 "$APP"
          code=$?
          set -e
          # 124 = still running when the timeout hit, i.e. the window came up fine
          if [ "$code" -ne 124 ]; then echo "AppImage exited early with code $code"; exit 1; fi
          echo "AppImage launched OK"

      - uses: actions/upload-artifact@v4
        with:
          name: PibbyGlitchCursorInstaller-x86_64.AppImage
          path: dist/PibbyGlitchCursorInstaller-x86_64.AppImage

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/PibbyGlitchCursorInstaller-x86_64.AppImage --clobber
